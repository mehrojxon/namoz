<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Namoz vaqtlari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0e6b63">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10302c;--mut:#5f7a75;--ac:#0e6b63;--gold:#b8851f;--line:#d5e2de}
@media(prefers-color-scheme:dark){:root{--bg:#0c1c1b;--card:#132928;--ink:#e6f1ee;--mut:#8aa8a2;--ac:#4cb5a9;--gold:#e0b24f;--line:#1f3d3a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto;padding:18px}
.tab{display:none}.tab.on{display:block}
.mut{color:var(--mut);font-size:14px}
.hero{padding:22px 0 18px}
#cd{font:700 52px/1.1 Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
#nn{color:var(--gold);font-weight:700}
ul{list-style:none;margin:8px 0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line)}
li{display:flex;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);font-size:18px}
li:last-child{border:0}
li b{font:700 20px Georgia,serif;font-variant-numeric:tabular-nums}
li.now{background:var(--ac);color:#fff;border-radius:14px}
li.now b{color:#fff}
#cnt{font:700 84px/1 Georgia,serif;text-align:center;margin:26px 0 8px;font-variant-numeric:tabular-nums}
#tap{display:block;width:210px;height:210px;margin:18px auto;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:20px;box-shadow:0 0 0 10px var(--line)}
#tap:active{transform:scale(.97)}
.row{display:flex;gap:8px;justify-content:center;margin-top:18px}
.row button{padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.row button.on{background:var(--gold);border-color:var(--gold);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px;border:0;background:none;color:var(--mut);font-size:16px}
nav button.on{color:var(--ac);font-weight:700}
button:focus-visible{outline:3px solid var(--gold)}
</style>
</head>
<body>
<main>
<section class="tab on" id="t1">
  <div class="hero">
    <div class="mut"><span id="joy"></span> <span id="sana"></span></div>
    <div>Keyingi namoz: <span id="nn">…</span></div>
    <div id="cd">--:--:--</div>
  </div>
  <ul id="list"></ul>
  <p class="mut" id="yang"></p>
</section>
<section class="tab" id="t2">
  <div id="cnt">0</div>
  <div class="mut" style="text-align:center" id="rounds"></div>
  <button id="tap">Bosing</button>
  <div class="row" id="targets"></div>
  <div class="row"><button id="reset">Nolga qaytarish</button></div>
</section>
</main>
<nav>
  <button data-t="t1" class="on">Vaqtlar</button>
  <button data-t="t2">Tasbeh</button>
</nav>
<script>
const $=id=>document.getElementById(id);
const N=[["bomdod","Bomdod"],["quyosh","Namoz uyqudan afzal"],["peshin","Peshin"],["asr","Asr"],["shom","Shom"],["xufton","Xufton"]];
const DEF={joy:"",yangilangan:"",vaqtlar:{bomdod:"05:30",quyosh:"06:50",peshin:"12:30",asr:"15:45",shom:"18:05",xufton:"19:30"}};
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let D=get("vaqt",DEF);

/* Namoz vaqtlari: internetdan olinadi, bo'lmasa oxirgi saqlangani ko'rsatiladi */
async function sync(){
  try{const r=await fetch("vaqtlar.json",{cache:"no-store"});if(!r.ok)throw 0;
    D=await r.json();localStorage.setItem("vaqt",JSON.stringify(D))}catch(e){}
  draw();
}
function draw(){
  $("joy").textContent=D.joy||"";
  $("sana").textContent=new Date().toLocaleDateString("uz",{day:"numeric",month:"long"});
  $("list").innerHTML=N.map(([k,n])=>`<li><span>${n}</span><b>${D.vaqtlar[k]}</b></li>`).join("");
  $("yang").textContent=D.yangilangan?"Vaqtlar yangilangan: "+D.yangilangan:"";
  tick();
}
const sec=t=>{const[a,b]=t.split(":");return(+a*60+ +b)*60};
function tick(){
  const d=new Date(),s=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
  let k=N.findIndex(([id])=>sec(D.vaqtlar[id])>s),diff;
  if(k<0){k=0;diff=sec(D.vaqtlar.bomdod)+86400-s}else diff=sec(D.vaqtlar[N[k][0]])-s;
  const p=x=>String(x).padStart(2,"0");
  $("nn").textContent=N[k][1];
  $("cd").textContent=p(diff/3600|0)+":"+p(diff%3600/60|0)+":"+p(diff%60);
  [...$("list").children].forEach((li,i)=>li.classList.toggle("now",i==k));
}
setInterval(tick,1000);
addEventListener("online",sync);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});

/* Tasbeh */
let T=get("tasbeh",{n:0,max:33,r:0});
const vib=ms=>navigator.vibrate&&navigator.vibrate(ms);
function showT(){
  $("cnt").textContent=T.n;
  $("rounds").textContent="Aylanishlar: "+T.r+" (har biri "+T.max+" ta)";
  [...$("targets").children].forEach(b=>b.classList.toggle("on",+b.dataset.v===T.max));
  localStorage.setItem("tasbeh",JSON.stringify(T));
}
$("targets").innerHTML=[33,99,100].map(v=>`<button data-v="${v}">${v}</button>`).join("");
$("targets").onclick=e=>{const v=+e.target.dataset.v;if(v){T.max=v;T.n=0;showT()}};
$("tap").onclick=()=>{T.n++;if(T.n>=T.max){T.n=0;T.r++;vib(200)}else vib(12);showT()};
$("reset").onclick=()=>{T.n=0;T.r=0;showT()};

/* Bo'limlar (keyin Duolar yoki Qibla qo'shish uchun: yangi <section> va yangi tugma) */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab,nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");$(b.dataset.t).classList.add("on");
});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
showT();sync();
</script>
</body>
</html>
